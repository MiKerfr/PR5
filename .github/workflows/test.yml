name: Run Tests

on: 
  push:
    branches: [ '*' ]  
  pull_request:
    branches: [ '*' ]  

jobs:
  test:
    runs-on: ubuntu
    
    steps:
      
      - uses: actions/checkout@v2
        
      
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
          
      
      - run: npm install
        
      
      - run: npm test
